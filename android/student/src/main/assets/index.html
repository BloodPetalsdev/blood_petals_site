nt-weight:850;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:17px}.card{border:1px solid var(--border);background:var(--surface);border-radius:19px;padding:21px;box-shadow:var(--shadow)}.statlabel{font-size:12px;color:var(--muted);font-weight:700}.statvalue{font-size:clamp(25px,3.8vw,35px);letter-spacing:-1px;font-weight:850;margin-top:9px}.statnote{font-size:12px;color:var(--muted);margin-top:5px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 1px 12px}.section-head h2{font-size:18px;letter-spacing:-.4px;margin:0}.section-head small{color:var(--muted)}.list{display:grid;gap:11px}.line{display:flex;gap:12px;align-items:center;justify-content:space-between}.course{padding:16px 18px}.course-name{font-weight:770;font-size:14px}.course-meta{font-size:12px;color:var(--muted);margin-top:4px}.score{font-size:18px;font-weight:820}.track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,#7488fa,#5165eb);border-radius:99px}.grade-row,.freq-row{padding:15px 17px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.grade-row:last-child,.freq-row:last-child{border-bottom:0}.grade-row strong{display:block;font-size:14px}.grade-row small{display:block;font-size:12px;color:var(--muted);margin-top:5px}.pill{border-radius:20px;padding:7px 11px;font-size:12px;font-weight:850;white-space:nowrap}.pill-ok{background:var(--okbg);color:var(--ok)}.pill-bad{background:var(--badbg);color:var(--bad)}.pill-neutral{background:var(--soft);color:var(--primary)}.muted{color:var(--muted)}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:14px 0}.offline{background:var(--soft);color:var(--primary);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:650}.auth{max-width:500px;margin:35px auto}.auth h1{font-size:27px;letter-spacing:-.7px;margin:0 0 5px}.auth p{color:var(--muted);line-height:1.6;font-size:14px}.field-label{font-size:13px;font-weight:730;display:block;margin:18px 0 7px}.field{width:100%;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--ink);padding:14px 15px;min-height:48px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.btn{border:1px solid var(--primary);border-radius:11px;background:var(--primary);color:white;padding:12px 18px;font-size:14px;font-weight:800;min-height:44px}.btn-secondary{color:var(--primary);background:transparent;border-color:var(--border)}.btn:disabled{opacity:.5;cursor:not-allowed}.notification{padding:13px 15px;border-radius:12px;margin:14px 0;background:var(--soft);font-size:13px;color:var(--primary);line-height:1.5}.notification.error{background:var(--badbg);color:var(--bad)}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:9px 8px max(11px,env(safe-area-inset-bottom));gap:4px}.nav button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;flex:1;background:transparent;border:0;border-radius:11px;color:var(--muted);padding:9px 2px;font-size:10px;font-weight:780}.nav button.active{color:var(--primary);background:var(--soft)}.nav button span{font-size:20px}.text-btn{background:none;color:var(--primary);border:0;font-weight:750;padding:4px 0}.profile-grid{display:grid;gap:10px}.profile-entry{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:13px 0}.profile-entry:last-child{border:0}.profile-entry b{font-size:14px}.profile-entry small{color:var(--muted);font-size:12px}.month-select{border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--ink);padding:10px;max-width:170px;font-size:13px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}.empty{text-align:center;padding:33px 16px;color:var(--muted);font-size:14px}.busy{pointer-events:none;opacity:.55}@media(max-width:600px){.wrap{padding:16px 13px 124px}.top{padding:10px 13px}.brand strong{font-size:18px}.mark{width:39px;height:39px;font-size:18px}.hero{padding:22px 20px;border-radius:20px}.hero h1{font-size:24px}.avatar{width:62px;height:62px;border-radius:18px}.stats{gap:8px}.card{padding:15px;border-radius:15px}.statlabel{font-size:10px}.statvalue{font-size:24px}.statnote{font-size:10px}.course{padding:14px}.grade-row,.freq-row{padding:13px 12px}.auth{margin:10px auto}.section-head h2{font-size:17px}}
</style></head><body><header class="top"><div class="top-inner"><div class="brand"><div class="mark">E</div><div><strong>EduClass</strong><small>PORTAL DO ALUNO</small></div></div><div class="top-actions"><button class="iconbtn" type="button" data-action="refresh" title="Atualizar notas">↻</button><button class="iconbtn" type="button" data-action="theme" title="Alterar tema" aria-label="Alterar tema">◐</button></div></div></header><main class="wrap" id="root"><div class="auth card"><h1>EduClass Aluno</h1><p>Carregando o portal…</p></div></main><nav id="bottom" class="nav" hidden></nav><input id="fileImport" type="file" accept="application/json,.json" hidden>
<script>
/* EduClass Connect — cliente Supabase REST, sem SDK externo */
(function(){
'use strict';
const PREFIX='educlass-connect-config-v1';
function storage(name){return 'educlass-connect-'+name+'-session-v1';}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}}
const failMsg=(obj,status)=>String(obj?.message||obj?.error_description||obj?.error||obj?.msg||`Erro HTTP ${status}`);
class EduCloud {
 constructor(role){this.role=role;this.config=load(PREFIX);this.session=load(storage(role));}
 get configured(){return !!(this.config?.url&&this.config?.key);}
 configure(url,key){url=String(url||'').trim().replace(/\/+$/,'');key=String(key||'').trim();if(!/^https:\/\/[\w.-]+(?::\d+)?$/.test(url))throw Error('Use a URL HTTPS do projeto Supabase.');if(key.length<20||key.toLowerCase().includes('service_role'))throw Error('Informe a chave pública anon/publishable, nunca a service_role.');const changed=url!==this.config?.url||key!==this.config?.key;this.config={url,key};localStorage.setItem(PREFIX,JSON.stringify(this.config));if(changed)this.logout();}
 get userId(){return this.session?.user?.id||null;}
 get loggedIn(){return !!this.session?.access_token;}
 logout(){this.session=null;localStorage.removeItem(storage(this.role));}
 setSession(session){if(session?.access_token){this.session={...session,expires_at:Date.now()+Number(session.expires_in||3600)*1000};localStorage.setItem(storage(this.role),JSON.stringify(this.session));}}
 async request(path,{method='GET',body=null,auth=true,extra={}}={}){
  if(!this.configured)throw Error('Configure o servidor Supabase primeiro.');
  if(auth)await this.ensureToken();
  const headers={'apikey':this.config.key,'Authorization':'Bearer '+(auth?this.session.access_token:this.config.key),...extra};
  if(body!==null)headers['Content-Type']='application/json';
  let res;
  try{res=await fetch(this.config.url+path,{method,headers,body:body===null?undefined:JSON.stringify(body),cache:'no-store'});}catch(e){throw Error('Sem conexão com o servidor. Verifique a internet e o endereço.');}
  const raw=await res.text();let result=null;try{result=raw?JSON.parse(raw):null;}catch{result=raw;}
  if(!res.ok)throw Error(failMsg(result,res.status));
  return result;
 }
 async ensureToken(){
  if(!this.session?.access_token)throw Error('Entre na sua conta para continuar.');
  if(Number(this.session.expires_at)>Date.now()+60000)return;
  if(!this.session.refresh_token)throw Error('Sessão expirada. Entre novamente.');
  let res;
  try{res=await fetch(this.config.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':this.config.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:this.session.refresh_token})});}catch{throw Error('Sem internet para renovar a sessão.');}
  const data=await res.json();if(!res.ok){this.logout();throw Error(failMsg(data,res.status));}
  this.setSession(data);
 }
 async login(email,password){const session=await this.request('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false});this.setSession(session);return session;}
 async register(email,password){const out=await this.request('/auth/v1/signup',{method:'POST',body:{email,password},auth:false});if(out?.access_token)this.setSession(out);return out;}
 async getSchool(){if(!this.userId)throw Error('Entre na sua conta.');const res=await this.request('/rest/v1/educlass_schools?owner_id=eq.'+encodeURIComponent(this.userId)+'&select=id,data,updated_at&limit=1');return res?.[0]||null;}
 async createSchool(data){const rows=await this.request('/rest/v1/educlass_schools',{method:'POST',body:{owner_id:this.userId,data},extra:{Prefer:'return=representation'}});return rows?.[0]||null;}
 async saveSchool(id,data){const rows=await this.request('/rest/v1/educlass_schools?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{data,updated_at:new Date().toISOString()},extra:{Prefer:'return=representation'}});if(!rows?.length)throw Error('Escola não encontrada no servidor.');return rows[0];}
 async getInvites(id){return await this.request('/rest/v1/educlass_invites?school_id=eq.'+encodeURIComponent(id)+'&select=id,student_id,code,user_id&order=created_at.asc');}
 async makeInvite(schoolId,studentId){const code='EC-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');const rows=await this.request('/rest/v1/educlass_invites',{method:'POST',body:{school_id:schoolId,student_id:studentId,code},extra:{Prefer:'return=representation'}});return rows?.[0];}
 async resetInvite(id){const code='EC-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');const rows=await this.request('/rest/v1/educlass_invites?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:{code,user_id:null},extra:{Prefer:'return=representation'}});return rows?.[0];}
 async claim(code){return this.request('/rest/v1/rpc/educlass_claim_invite',{method:'POST',body:{p_code:String(code).trim().toUpperCase()}});}
 async snapshot(){return this.request('/rest/v1/rpc/educlass_student_snapshot',{method:'POST',body:{}});}
 pairing(){if(!this.configured)throw Error('Configure o servidor.');return 'EDUCLASS-CONNECT:'+btoa(JSON.stringify(this.config));}
 acceptPairing(code){const text=String(code||'').trim();if(!text.startsWith('EDUCLASS-CONNECT:'))throw Error('Código do servidor inválido.');let obj;try{obj=JSON.parse(atob(text.slice('EDUCLASS-CONNECT:'.length)));}catch{throw Error('Código do servidor incompleto.');}this.configure(obj.url,obj.key);}
}
window.EduCloud=EduCloud;
})();

</script>
<script>
(()=>{'use strict';
const API=new EduCloud('student'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),fmt=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const safePhoto=s=>typeof s==='string'&&s.length<450000&&/^data:image\/(?:png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(s)?s:'';
const monthNow=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const dateFmt=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d))?d.split('-').reverse().join('/'):'Data não informada';
const monthLabel=m=>/^\d{4}-\d{2}$/.test(m)?new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}):m;
let month=monthNow(),view='home',mode=localStorage.getItem('educlass-student-mode')||'cloud',snap=null;
let message='',isError=false,loading=false,lastFetch='',poll=null;
function notify(s,err=false){message=s;isError=err;render();}
function theme(){return localStorage.getItem('educlass-student-theme')==='dark'?'dark':'light';}
function applyTheme(){document.documentElement.dataset.theme=theme();}
function saveSnap(s){localStorage.setItem('educlass-student-cache-v1',JSON.stringify({userId:API.userId||null,payload:s}));}
function readCache(){try{const c=JSON.parse(localStorage.getItem('educlass-student-cache-v1')||'null');if(c&&c.userId===API.userId)return c.payload;}catch{}return null;}
function validSnap(s){return s&&typeof s==='object'&&typeof s.student?.id==='string'&&Array.isArray(s.grades)&&Array.isArray(s.attendance)&&s.grades.every(g=>g.studentId===s.student.id&&g.published===true);}
function score(gr){let sum=0,w=0;for(const g of gr){const n=Number(g.score),a=Number(g.weight)||1;if(Number.isFinite(n)&&n>=0&&n<=10&&a>0){sum+=n*a;w+=a;}}return w?sum/w:null;}
function grouping(){const map=new Map();for(const g of (snap?.grades||[])){const arr=map.get(g.subject)||[];arr.push(g);map.set(g.subject,arr);}return Array.from(map.entries()).sort((a,b)=>a[0].localeCompare(b[0],'pt-BR'));}
function overall(){const vals=grouping().map(([sub,grades])=>score(grades)).filter(x=>x!==null);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;}
function monthGr(g){const d=String(g.date||g.createdAt||'').slice(0,10);return d.startsWith(month);}
function monthResult(){const subMap=new Map();for(const g of snap?.grades||[]){if(!monthGr(g))continue;const arr=subMap.get(g.subject)||[];arr.push(g);subMap.set(g.subject,arr);}const vals=[...subMap.values()].map(score).filter(v=>v!==null),avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
 const rows=(snap?.attendance||[]).filter(a=>String(a.date).startsWith(month)),p=rows.filter(a=>a.present).length,pct=rows.length?p/rows.length*100:null;
 const weight=Math.max(0,Math.min(50,Number(snap?.attendanceWeight)||0))/100;
 return {avg,percent:pct,total:rows.length,present:p,absent:rows.length-p,final:avg===null?null:pct===null?avg:avg*(1-weight)+pct/10*weight};}
function avatar(){const pic=safePhoto(snap?.student?.photo);return `<div class="avatar">${pic?`<img alt="Foto do aluno" src="${pic}">`:esc((snap?.student?.name||'A').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase())}</div>`;}
function hero(){return `<div class="hero"><div><div class="eyebrow">PAINEL DO ESTUDANTE</div><h1>Olá, ${esc((snap?.student?.name||'estudante').split(' ')[0])}! 👋</h1><p>${esc(snap?.class?.name||'Turma não informada')} · ${esc(snap?.school||'EduClass')}</p></div>${avatar()}</div>`;}
function stats(monthly){return `<div class="stats"><div class="card"><div class="statlabel">Média mensal</div><div class="statvalue">${monthly.final===null?'—':fmt(monthly.final)}</div><div class="statnote">Com frequência</div></div><div class="card"><div class="statlabel">Frequência</div><div class="statvalue">${monthly.percent===null?'—':Math.round(monthly.percent)+'%'}</div><div class="statnote">${monthly.absent} falta(s)</div></div><div class="card"><div class="statlabel">Média geral</div><div class="statvalue">${overall()===null?'—':fmt(overall())}</div><div class="statnote">Notas publicadas</div></div></div>`;}
function gradesBody(){const groups=grouping();if(!groups.length)return `<div class="card empty">Nenhuma nota publicada por enquanto.</div>`;
 return groups.map(([subject,grades])=>{const sc=score(grades);return `<div class="card course"><div class="line"><div><div class="course-name">${esc(subject)}</div><div class="course-meta">${grades.length} avaliação(ões) publicada(s)</div></div><span class="score">${sc===null?'—':fmt(sc)}</span></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,(sc||0)*10))}%"></div></div>${view==='grades'?`<div style="margin-top:14px">${grades.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(g=>`<div class="grade-row"><div><strong>${esc(g.assessment||'Avaliação')}</strong><small>${dateFmt(g.date)} · Peso ${Number(g.weight)||1}</small></div><span class="pill pill-neutral">${fmt(g.score)}</span></div>`).join('')}</div>`:''}</div>`}).join('');}
function nav(){return `<button data-page="home" class="${view==='home'?'active':''}"><span>⌂</span>Início</button><button data-page="grades" class="${view==='grades'?'active':''}"><span>▤</span>Notas</button><button data-page="frequency" class="${view==='frequency'?'active':''}"><span>▦</span>Frequência</button><button data-page="profile" class="${view==='profile'?'active':''}"><span>◉</span>Perfil</button>`;}
function portal(){const m=monthResult(),isOffline=mode!=='cloud',syncLabel=isOffline?'Visualização offline — sem sincronização automática':API.loggedIn?'Dados atualizados pela conta conectada':'Informações em cache — sem conexão';
 let body='';if(view==='home'){body=`${hero()}${stats(m)}<div class="section-head"><h2>Suas disciplinas</h2><button class="text-btn" data-page="grades">Ver notas ›</button></div><div class="list">${gradesBody()}</div>`;}
 else if(view==='grades'){body=`${hero()}<div class="section-head"><h2>Avaliações publicadas</h2><small>${(snap.grades||[]).length} notas</small></div><div class="list">${gradesBody()}</div>`;}
 else if(view==='frequency'){body=`${hero()}<div class="section-head"><h2>Minha frequência</h2><input id="month" class="month-select" aria-label="Selecionar mês" type="month" value="${esc(month)}"></div>${stats(m)}<div class="section-head"><h2>Chamadas do mês</h2><small>${m.total} dia(s)</small></div><div class="card" style="padding:0">${(snap.attendance||[]).filter(a=>String(a.date).startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="freq-row"><strong>${dateFmt(a.date)}</strong><span class="pill ${a.present?'pill-ok':'pill-bad'}">${a.present?'✓ Presente':'✕ Falta'}</span></div>`).join('')||'<div class="empty">Nenhuma chamada registrada neste mês.</div>'}</div><p class="hint">A frequência considera somente os dias com chamada salva pelo professor.</p>`;}
 else {body=`${hero()}<div class="section-head"><h2>Meu perfil</h2></div><div class="card profile-grid"><div class="profile-entry"><small>Nome</small><b>${esc(snap.student.name)}</b></div><div class="profile-entry"><small>Turma</small><b>${esc(snap.class?.name||'—')}</b></div><div class="profile-entry"><small>Escola</small><b>${esc(snap.school||'—')}</b></div><div class="profile-entry"><small>Matrícula</small><b>${esc(snap.student.enrollment||'Não informada')}</b></div><div class="profile-entry"><small>Professor(a)</small><b>${esc(snap.teacher||'—')}</b></div><div class="profile-entry"><small>Última sincronização</small><b>${esc(lastFetch||'—')}</b></div></div><p class="hint">As notas só aparecem depois de publicadas. Este portal é de leitura: estudantes não podem editar boletins ou frequência.</p><div class="actions"><button class="btn btn-secondary" data-action="logout">Sair do aluno</button><button class="btn btn-secondary" data-action="setup">Alterar servidor</button><button class="btn btn-secondary" data-action="import">Importar boletim</button></div>`;}
 return `<div class="offline">${esc(syncLabel)} ${loading?'· Atualizando...':''}</div>${notice()}${body}<p class="footer">EduClass Aluno 1.0 · Seu boletim, sua frequência, sua escola.</p>`;}
function notice(){return message?`<div class="notification ${isError?'error':''}" role="status">${esc(message)}</div>`:'';}
function setup(){return `<div class="auth card"><div class="eyebrow" style="color:var(--primary);margin-bottom:12px">CONEXÃO ESCOLAR</div><h1>Conecte seu EduClass</h1><p>O professor deve enviar um <b>código do servidor</b> e depois um <b>convite pessoal</b>. Cole o código do servidor aqui. Seus dados ficam protegidos pelo login e pelas permissões do banco.</p>${notice()}<label class="field-label" for="pair">Código do servidor</label><input class="field" id="pair" autocomplete="off" placeholder="EDUCLASS-CONNECT:..." value=""><div class="actions"><button class="btn" data-action="pair">Conectar servidor</button>${API.configured?'<button class="btn btn-secondary" data-action="back">Voltar</button>':''}</div><div style="margin-top:22px;border-top:1px solid var(--border);padding-top:18px"><b>Quer testar sem servidor?</b><p>Experimente os dados de exemplo ou importe um boletim individual gerado pelo aplicativo do professor.</p><div class="actions"><button class="btn btn-secondary" data-action="demo">Ver demonstração</button><button class="btn btn-secondary" data-action="import">Importar boletim (.json)</button></div></div></div>`;}
function login(){return `<div class="auth card"><div class="eyebrow" style="color:var(--primary);margin-bottom:12px">ÁREA DO ESTUDANTE</div><h1>Sua conta escolar</h1><p>Entre com seu e-mail e senha ou crie uma conta para usar o convite do professor. Se solicitado, confirme seu e-mail antes de entrar.</p>${notice()}<label class="field-label">E-mail</label><input class="field" type="email" id="email" autocomplete="email" placeholder="seuemail@exemplo.com"><label class="field-label">Senha</label><input class="field" type="password" id="password" autocomplete="current-password" placeholder="Sua senha (mínimo 6 caracteres)"><div class="actions"><button class="btn" data-action="login">Entrar</button><button class="btn btn-secondary" data-action="signup">Criar conta</button></div><p style="margin-top:20px"><button class="text-btn" data-action="setup">Trocar servidor</button></p></div>`;}
function claim(){return `<div class="auth card"><div class="eyebrow" style="color:var(--primary);margin-bottom:12px">CONVITE INDIVIDUAL</div><h1>Vincular meu cadastro</h1><p>Conta conectada: <b>${esc(API.session?.user?.email||'aluno')}</b>. Digite o convite que o professor gerou para o seu nome. Este código só pode ser vinculado a uma conta.</p>${notice()}<label class="field-label">Meu código de convite</label><input id="invite" class="field" autocomplete="off" placeholder="EC-XXXXXXXXXXXX"><div class="actions"><button class="btn" data-action="claim">Vincular meu aluno</button><button class="btn btn-secondary" data-action="logout">Sair</button></div></div>`;}
function demoData(){const d=new Date().toISOString().slice(0,10);return {school:'Escola de demonstração',teacher:'Professora Exemplo',pass:6,attendanceWeight:20,student:{id:'demo',name:'Alex Martins',enrollment:'0001',classId:'class-demo',photo:''},class:{id:'class-demo',name:'1º Ano A',year:new Date().getFullYear()},grades:[{studentId:'demo',subject:'Matemática',assessment:'Atividade 1',score:9,weight:1,published:true,date:d},{studentId:'demo',subject:'Matemática',assessment:'Atividade 2',score:7,weight:1,published:true,date:d},{studentId:'demo',subject:'Português',assessment:'Produção de texto',score:8,weight:1,published:true,date:d},{studentId:'demo',subject:'Ciências',assessment:'Projeto',score:9.5,weight:1,published:true,date:d}],attendance:[{date:d,present:true}],updatedAt:new Date().toISOString()};}
function render(){applyTheme();const root=$('#root'),bottom=$('#bottom');if(snap&&validSnap(snap)){root.innerHTML=portal();bottom.hidden=false;bottom.innerHTML=nav();return;}bottom.hidden=true;root.innerHTML=mode==='setup'||!API.configured?setup():!API.loggedIn?login():claim();}
async function refresh(silent=false){if(!API.configured||!API.loggedIn||mode!=='cloud')return;loading=true;if(!silent)render();try{const out=await API.snapshot();if(!validSnap(out))throw Error('O servidor retornou dados incompletos.');snap=out;saveSnap(out);lastFetch=new Date().toLocaleString('pt-BR');message='';isError=false;}catch(e){if(!silent||!snap){message=e.message;isError=true;}if(!snap)snap=readCache();}finally{loading=false;render();}}
async function handle(action){try{
 if(action==='theme'){localStorage.setItem('educlass-student-theme',theme()==='dark'?'light':'dark');render();return;}
 if(action==='setup'){mode='setup';snap=null;message='';render();return;}
 if(action==='back'){mode='cloud';snap=readCache();message='';render();return;}
 if(action==='pair'){API.acceptPairing($('#pair').value);mode='cloud';localStorage.setItem('educlass-student-mode',mode);snap=null;message='';render();return;}
 if(action==='login'||action==='signup'){
  const email=$('#email')?.value?.trim(),password=$('#password')?.value;if(!email||!password||password.length<6)throw Error('Use um e-mail válido e uma senha com pelo menos 6 caracteres.');
  if(action==='signup'){const out=await API.register(email,password);if(!API.loggedIn){notify('Conta criada! Confirme o e-mail recebido e depois entre na sua conta.');return;}}
  else await API.login(email,password);message='';mode='cloud';localStorage.setItem('educlass-student-mode',mode);await refresh();return;
 }
 if(action==='claim'){const code=$('#invite')?.value.trim();if(!code)throw Error('Informe o código do aluno.');await API.claim(code);message='';await refresh();return;}
 if(action==='refresh'){await refresh();return;}
 if(action==='logout'){API.logout();snap=null;localStorage.removeItem('educlass-student-cache-v1');mode='cloud';localStorage.setItem('educlass-student-mode',mode);message='Sessão encerrada.';render();return;}
 if(action==='demo'){mode='demo';localStorage.setItem('educlass-student-mode',mode);snap=demoData();lastFetch='Demonstração';message='Dados de exemplo. Não representam alunos reais.';render();return;}
 if(action==='import'){$('#fileImport').click();return;}
 }catch(e){notify(e.message||'Não foi possível concluir a ação.',true);}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-page],[data-action]');if(!button)return;if(button.dataset.page){view=button.dataset.page;message='';render();window.scrollTo(0,0);}else handle(button.dataset.action);});
document.addEventListener('change',e=>{if(e.target.id==='month'){month=e.target.value;render();}});
$('#fileImport').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>3e6)throw Error('Arquivo maior que o permitido (3 MB).');const data=JSON.parse(await f.text());if(!validSnap(data))throw Error('Este arquivo não é um boletim individual EduClass válido.');snap=data;mode='imported';localStorage.setItem('educlass-student-offline-v1',JSON.stringify(data));localStorage.setItem('educlass-student-mode',mode);lastFetch='Arquivo local';message='Boletim importado. Para atualizar, importe uma nova versão.';render();}catch(err){notify(err.message,true);}finally{e.target.value='';}});
window.addEventListener('online',()=>{if(mode==='cloud'&&API.loggedIn)refresh(true);});
window.setInterval(()=>{if(mode==='cloud'&&API.loggedIn&&document.visibilityState==='visible')refresh(true);},30000);
if(mode==='demo'){snap=demoData();lastFetch='Demonstração';}
else if(mode==='cloud'&&API.configured&&API.loggedIn){snap=readCache();refresh(true);}
else if(mode==='imported'){try{const cached=JSON.parse(localStorage.getItem('educlass-student-offline-v1')||'null');if(validSnap(cached)){snap=cached;lastFetch='Arquivo local';}else mode='setup';}catch{mode='setup';}}
render();
window.educlassHandleBack=()=>{if(snap&&view!=='home'){view='home';render();return true;}return false;};
})();
</script></body></html>
