/* Fotografias de alunos: miniaturas, cartões e boletins */
.avatar.photo-avatar{overflow:hidden;padding:0;border:1px solid #e2e7f2;background:#f0f3fa}
.photo-avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.avatar.avatar-xl{width:82px;height:82px;border-radius:21px;font-size:27px}
.avatar.avatar-lg{width:58px;height:58px;border-radius:15px;font-size:19px}
.report-person .avatar{height:56px;width:56px;border-radius:13px;font-size:18px}
.student-name-btn{font-weight:800;font-size:12px;background:none;border:none;padding:0;text-align:left;color:var(--ink);cursor:pointer}
.student-name-btn:hover{text-decoration:underline;color:var(--blue)}
.photo-picker{display:flex;align-items:center;gap:17px;background:#f8faff;border:1px solid #e6ebff;border-radius:15px;padding:16px}
.photo-picker-preview{position:relative;flex-shrink:0}
.photo-picker-actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.photo-picker-actions small{font-size:11px;color:#8995aa;line-height:1.45}
.photo-picker-actions .btn{white-space:normal;text-align:center}
.photo-loading{font-size:11px;color:#536bd5;min-height:15px}
.profile-head{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid #edf0f6}
.profile-head h3{font-size:20px;line-height:1.2;margin:0 0 5px;letter-spacing:-.5px}
.profile-head p{font-size:12px;color:#8290a3;margin:0}
.profile-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.profile-meta>div{background:#f7f9fd;border:1px solid #edf1f8;border-radius:12px;padding:13px}
.profile-meta small{font-size:10px;color:#8e9cb0;display:block;margin-bottom:6px}
.profile-meta strong{font-size:13px;color:#303f5c;word-break:break-word}
.profile-section-title{font-size:12px;margin:22px 0 10px;color:#61708a;text-transform:uppercase;letter-spacing:.8px}
.profile-grades{max-height:160px;overflow:auto;border-top:1px solid #edf1f5}
.profile-grades .student-entry{padding:10px 0}
@media(max-width:430px){.photo-picker{gap:12px;padding:11px}.avatar.avatar-xl{width:72px;height:72px}.photo-picker-actions .btn{font-size:11px}.profile-meta{grid-template-columns:1fr 1fr}}
@media print{.photo-avatar img{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

/* EduClass App 2.0 — aplicativo com fotos grandes e diário expansível */
:root{--nav:#101d35;--blue:#4e65e8;--blue2:#334ac6;--radius:19px}
.avatar.avatar-student{width:102px;height:102px;border-radius:23px;font-size:31px;box-shadow:0 5px 18px #2537540b}
.avatar.avatar-diary{width:88px;height:88px;border-radius:22px;font-size:27px}
.avatar.avatar-profile{width:126px;height:126px;border-radius:25px;font-size:34px}
.avatar.avatar-picker{width:116px;height:116px;border-radius:25px;font-size:32px}
.avatar.avatar-report,.report-person .avatar{width:76px;height:76px;border-radius:18px;font-size:25px}
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:15px}
.student-tile{padding:18px;min-width:0;transition:border .15s,transform .15s}
.student-tile:hover{border-color:#dce3fa}
.student-tile-body{display:flex;align-items:center;gap:17px;min-width:0}
.student-tile-photo{flex-shrink:0;padding:0;background:transparent;border:0;border-radius:23px;line-height:0}
.student-tile-info{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;flex:1}
.student-tile-name{border:0;background:transparent;text-align:left;font-size:16px;color:#1c2c4b;font-weight:850;letter-spacing:-.4px;padding:0;overflow-wrap:anywhere}
.student-tile-name:hover{color:var(--blue)}
.student-tile-class{font-size:12px;color:#5064c7;background:#eef1ff;border-radius:6px;padding:4px 7px;font-weight:700}
.student-tile-meta{font-size:11px;color:#8b98ac;overflow-wrap:anywhere}
.student-tile-average{color:#6b7b92;font-size:12px;margin-top:4px}
.student-tile-average b{color:#203154;font-size:15px;margin-left:5px}
.student-tile-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #eef0f5;padding-top:14px;margin-top:16px}

.diary-student{overflow:hidden}

.diary-student.expanded .diary-chevron{transform:rotate(180deg);background:#e9edff;color:#4f64e0}

.diary-bottom-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.diary-no-grades{padding:20px;background:white;border:1px dashed #dce4f5;border-radius:13px;color:#798aa2;font-size:13px}
.diary-explain{font-size:12px;color:#8593a8;line-height:1.7;margin:16px 4px}

<script>
(() => {'use strict';
const KEY='educlass-professor-v1';
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>Array.from(root.querySelectorAll(q));
const icon=(id)=>`<svg aria-hidden="true"><use href="#i-${id}"></use></svg>`;
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.() || ('id_'+Date.now()+'_'+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const defaultData=()=>({version:1,settings:{teacher:'Professor(a)',school:'Minha escola',pass:6,subjects:['Língua Portuguesa','Matemática','Ciências','História','Geografia','Inglês']},classes:[{id:uid(),name:'Turma 1',year:new Date().getFullYear()}],students:[],grades:[],modifiedAt:now()});
let storageEnabled=true;
function load(){try{const str=localStorage.getItem(KEY);if(!str)return defaultData();const raw=JSON.parse(str);if(!validData(raw))return defaultData();return {...defaultData(),...raw,settings:{...defaultData().settings,...raw.settings}};}catch(e){storageEnabled=false;return defaultData();}}
function validData(v){return !!v&&typeof v==='object'&&!Array.isArray(v)&&Array.isArray(v.classes)&&Array.isArray(v.students)&&Array.isArray(v.grades)&&typeof v.settings==='object'&&v.settings!==null;}
let db=load();
let page='dashboard';let openDiaryStudentId='';let filters={studentsSearch:'',studentsClass:'',classDiary:'',gradesSearch:'',gradesClass:'',gradesSubject:'',gradesStatus:'',reportStudentId:''};
function persist(){db.modifiedAt=now();try{localStorage.setItem(KEY,JSON.stringify(db));storageEnabled=true;}catch(e){storageEnabled=false;toast('Não foi possível salvar neste navegador. Faça um backup!',true);}$('#storageWarning').classList.toggle('hidden',storageEnabled);return storageEnabled;}
function initials(s){return String(s||'P').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
// Apenas fotos JPEG/PNG/WEBP em data URL; nunca URLs externas ou SVG.
const safePhoto=v=>typeof v==='string'&&v.length<250000&&/^data:image\/(?:jpeg|png|webp);base64,[a-zA-Z0-9+/=]+$/.test(v)?v:'';
function avatarHtml(s,size='',tone=''){const image=safePhoto(s?.photo);return `<span class="avatar ${size} ${tone} ${image?'photo-avatar':''}">${image?`<img src="${image}" alt="Foto de ${esc(s?.name||'aluno')}" loading="lazy">`:esc(initials(s?.name||'Aluno'))}</span>`;}
function compressPhoto(file){return new Promise((resolve,reject)=>{
 if(!file||!file.type.startsWith('image/')){reject(Error('Escolha uma imagem JPG, PNG ou WebP.'));return;}
 if(file.size>12*1024*1024){reject(Error('A foto deve ter até 12 MB.'));return;}
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{try{const limit=320,ratio=Math.min(1,limit/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);let data=canvas.toDataURL('image/jpeg',.73);if(data.length>185000){const smaller=document.createElement('canvas');smaller.width=Math.max(1,Math.round(w*.75));smaller.height=Math.max(1,Math.round(h*.75));smaller.getContext('2d').drawImage(canvas,0,0,smaller.width,smaller.height);data=smaller.toDataURL('image/jpeg',.6);}if(data.length>200000)throw Error('Esta imagem ficou muito grande. Escolha uma foto mais simples.');resolve(data);}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};
 img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Não foi possível abrir esta foto. Tente JPG ou PNG.'));};
 img.src=url;
 });}
const fmt=(n)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function avgGrade(items){let total=0,weight=0;for(const g of items){const n=Number(g.score),w=Number(g.weight)||1;if(Number.isFinite(n)&&n>=0&&n<=10&&w>0){total+=n*w;weight+=w;}}return weight?total/weight:null;}
function allSubjectNames(studentId,onlyPublished){const g=db.grades.filter(x=>x.studentId===studentId && (!onlyPublished||x.published));return [...new Set(g.map(x=>x.subject))].sort((a,b)=>a.localeCompare(b,'pt-BR'));}
function studentAvg(id,onlyPublished=false){const subs=allSubjectNames(id,onlyPublished);const avgs=subs.map(sub=>avgGrade(db.grades.filter(g=>g.studentId===id&&g.subject===sub&&(!onlyPublished||g.published)))).filter(x=>x!==null);return avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null;}
function globalAvg(){const vals=db.students.map(s=>studentAvg(s.id)).filter(x=>x!==null);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;}
const classById=id=>db.classes.find(c=>c.id===id);
const studentById=id=>db.students.find(s=>s.id===id);
const className=id=>classById(id)?.name || 'Sem turma';
const studentName=id=>studentById(id)?.name || 'Aluno removido';
function dateFmt(value){try{return new Date(value).toLocaleDateString('pt-BR');}catch(e){return '-';}}
function statusPill(g){return g.published?'<span class="pill green">● Publicada</span>':'<span class="pill amber">● Rascunho</span>';}
function scorePill(score){return `<span class="pill ${Number(score)>=Number(db.settings.pass)?'green':'red'}">${fmt(score)}</span>`;}
function empty(title,sub,iconName='users',button=''){return `<div class="empty"><div class="empty-icon">${icon(iconName)}</div><h3>${esc(title)}</h3><p>${esc(sub)}</p>${button}</div>`;}
function optionList(items,selected,placeholder,val=x=>x.id,label=x=>x.name){return `<option value="">${esc(placeholder)}</option>`+items.map(x=>`<option value="${esc(val(x))}" ${String(selected)===String(val(x))?'selected':''}>${esc(label(x))}</option>`).join('');}
function heading(kicker,title,desc,actions=''){return `<div class="section-heading"><div><span class="eyebrow">${esc(kicker)}</span><h1 class="h1">${esc(title)}</h1><p class="sub">${esc(desc)}</p></div><div class="btn-row noprint">${actions}</div></div>`;}
function btn(action,label,kind='primary',id='',extra=''){return `<button type="button" class="btn btn-${kind}" data-action="${action}" ${id?`data-id="${esc(id)}"`:''} ${extra}>${label}</button>`;}
function setPage(p){if(!['dashboard','students','diary','grades','reports','classes','settings'].includes(p))return;page=p;$('#sidebar').classList.remove('open');$('#mobileBackdrop').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){const names={dashboard:'Visão geral',students:'Alunos',diary:'Diário da turma',grades:'Notas e avaliações',reports:'Boletins',classes:'Turmas',settings:'Configurações'};$$('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));$('#crumbPage').textContent=names[page];$('#topTitle').textContent=page==='dashboard'?'Bem-vindo ao seu painel':names[page];$('#teacherName').textContent=db.settings.teacher||'Professor(a)';$('#teacherInitial').textContent=initials(db.settings.teacher);$('#topDate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});$('#storageWarning').classList.toggle('hidden',storageEnabled);$('#content').innerHTML=({dashboard:renderDashboard,students:renderStudents,diary:renderDiary,grades:renderGrades,reports:renderReports,classes:renderClasses,settings:renderSettings})[page]()+`<p class="footer-note">EduClass • Sistema de demonstração para organizar aulas e notas.<br><b>Os dados ficam salvos neste navegador.</b> Faça backups regulares em Configurações.</p>`;}
function renderDashboard(){const total=db.students.length,pub=db.grades.filter(g=>g.published).length,mean=globalAvg();const recent=[...db.grades].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);const subs=[...new Set(db.grades.map(g=>g.subject))];const progress=subs.map(sub=>({sub,n:avgGrade(db.grades.filter(g=>g.subject===sub))})).filter(x=>x.n!==null).sort((a,b)=>b.n-a.n).slice(0,6);return heading('SEU ESPAÇO DE ENSINO','Visão geral','Acompanhe suas turmas, alunos e resultados em um só lugar.',btn('newGrade',icon('plus')+' Lançar nota')+btn('newStudent',icon('plus')+' Novo aluno','outline'))+
`<div class="stats"><div class="card stat"><div class="stat-top"><span class="stat-label">Total de alunos</span><span class="stat-icon">${icon('users')}</span></div><div class="stat-value">${total}</div><div class="stat-note">Alunos cadastrados</div></div><div class="card stat"><div class="stat-top"><span class="stat-label">Turmas</span><span class="stat-icon green">${icon('classes')}</span></div><div class="stat-value">${db.classes.length}</div><div class="stat-note">Turmas cadastradas</div></div><div class="card stat"><div class="stat-top"><span class="stat-label">Notas publicadas</span><span class="stat-icon orange">${icon('notes')}</span></div><div class="stat-value">${pub}</div><div class="stat-note">${db.grades.length-pub} nota(s) em rascunho</div></div><div class="card stat"><div class="stat-top"><span class="stat-label">Média geral</span><span class="stat-icon pink">${icon('report')}</span></div><div class="stat-value">${mean===null?'—':fmt(mean)}</div><div class="stat-note">Média das médias dos alunos</div></div></div>
<div class="dashboard-grid"><section class="card panel"><div class="panel-header"><div><h2 class="panel-title">Últimas notas lançadas</h2><p class="panel-sub">Registros recentes em suas turmas</p></div>${btn('goGrades','Ver todas '+icon('arrow'),'ghost')}</div>${recent.length?`<div class="simple-list">${recent.map(g=>`<div class="student-entry">${avatarHtml(studentById(g.studentId),'',g.published?'green':'pink')}<div class="entry-main"><strong>${esc(studentName(g.studentId))}</strong><small>${esc(g.subject)} • ${esc(g.assessment)} • ${dateFmt(g.createdAt)}</small></div><strong class="grade-label">${fmt(g.score)}</strong>${statusPill(g)}</div>`).join('')}</div>`:empty('Nenhuma nota lançada','Clique em “Lançar nota” para começar a avaliar seus alunos.','notes',btn('newGrade',icon('plus')+' Lançar nota'))}</section>
<section class="card panel"><h2 class="panel-title">Desempenho por disciplina</h2><p class="panel-sub">Média das notas lançadas em cada matéria</p>${progress.length?`<div class="progress-group">${progress.map(x=>`<div><div class="progress-head"><strong>${esc(x.sub)}</strong><span>${fmt(x.n)} / 10</span></div><div class="progress"><div class="${x.n<Number(db.settings.pass)?'low':''}" style="width:${Math.max(0,Math.min(100,x.n*10))}%"></div></div></div>`).join('')}</div>`:empty('Sem desempenho ainda','As médias por disciplina aparecerão aqui.','report')}
<div class="helper-box"><strong>Organize suas aulas com facilidade</strong><p>Cadastre alunos, registre avaliações e publique resultados quando estiverem prontos.</p>${btn('newClass','Criar turma '+icon('arrow'),'outline')}</div></section></div>`;}

 </article>`}).join('')}</div>`:`<div class="card">${empty(db.students.length?'Nenhum aluno encontrado':'Sua lista de alunos está vazia',db.students.length?'Tente mudar os filtros para encontrar alguém.':'Cadastre o primeiro aluno para começar.','users',btn('newStudent',icon('plus')+' Cadastrar aluno'))}</div>`);

 const classAvg=avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null;
 const cards=students.map(s=>{
   const grades=db.grades.filter(g=>g.studentId===s.id).sort((a,b)=>a.subject.localeCompare(b.subject,'pt-BR')||a.createdAt.localeCompare(b.createdAt));

         <div class="diary-grade-value"><small>NOTA</small><b class="${g.score<Number(db.settings.pass)?'below':''}">${fmt(g.score)}</b></div>

    </div>
   </article>`;
 }).join('');
 return heading('DIÁRIO DE CLASSE','Notas por turma','Selecione uma turma e toque no nome de um aluno para abrir suas avaliações.',btn('newGrade',icon('plus')+' Lançar nota'))+
 `<section class="card diary-intro"><div class="diary-intro-text"><span class="eyebrow">TURMA SELECIONADA</span><h2>${esc(cl?.name||'Selecione uma turma')}</h2><p>Ano letivo ${esc(cl?.year||new Date().getFullYear())}</p></div><div class="diary-class-select"><label for="classDiarySelect">Escolher turma</label><select class="field" id="classDiarySelect" data-filter="classDiary" aria-label="Escolher turma">${optionList(allClasses,chosen,'Selecione a turma')}</select></div></section>
 <div class="diary-metrics"><div class="card"><small>Alunos</small><b>${students.length}</b></div><div class="card"><small>Atividades lançadas</small><b>${selectedGrades.length}</b></div><div class="card"><small>Média da turma</small><b>${classAvg===null?'—':fmt(classAvg)}</b></div></div>
 <div class="diary-list">${students.length?cards:`<div class="card">${empty('Nenhum aluno nesta turma','Cadastre alunos ou escolha outra turma para visualizar o diário.','users',btn('newStudent',icon('plus')+' Cadastrar aluno'))}</div>`}</div>

function matchingGrades(){const search=filters.gradesSearch.toLocaleLowerCase('pt-BR');return db.grades.filter(g=>(!filters.gradesClass||studentById(g.studentId)?.classId===filters.gradesClass)&&(!filters.gradesSubject||g.subject===filters.gradesSubject)&&(!filters.gradesStatus||(filters.gradesStatus==='published'?g.published:!g.published))&&(!search||studentName(g.studentId).toLocaleLowerCase('pt-BR').includes(search)||g.assessment.toLocaleLowerCase('pt-BR').includes(search))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}

`<div class="toolbar"><div class="filters"><input class="filter-input" data-filter="gradesSearch" value="${esc(filters.gradesSearch)}" type="search" placeholder="Buscar aluno ou avaliação" aria-label="Buscar notas"><select class="field" data-filter="gradesClass" aria-label="Filtrar turma">${optionList(db.classes,filters.gradesClass,'Todas as turmas')}</select><select class="field" data-filter="gradesSubject" aria-label="Filtrar disciplina"><option value="">Todas as disciplinas</option>${allSubs.map(s=>`<option ${filters.gradesSubject===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select><select class="field" data-filter="gradesStatus" aria-label="Filtrar publicação"><option value="">Todos os status</option><option value="draft" ${filters.gradesStatus==='draft'?'selected':''}>Rascunhos</option><option value="published" ${filters.gradesStatus==='published'?'selected':''}>Publicadas</option></select></div>${btn('exportGrades',icon('download')+' Exportar CSV','outline')}</div>

`<div class="toolbar noprint"><div class="filters"><select class="field" style="min-width:270px" data-filter="reportStudentId" aria-label="Selecionar aluno">${optionList(db.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')),id,'Selecione um aluno',x=>x.id,x=>x.name+' — '+className(x.classId))}</select></div></div>`+

`<div class="report-layout"><div class="card" id="reportSheet"><div class="report-header"><div><div class="report-brand">EDUCLASS · BOLETIM ESCOLAR</div><h2>${esc(db.settings.school)}</h2><p>Ano letivo ${esc(classById(s.classId)?.year||new Date().getFullYear())} • Data de emissão: ${new Date().toLocaleDateString('pt-BR')}</p></div><span class="logo">${icon('school')}</span></div><div class="report-inner"><div class="report-person">${avatarHtml(s,'avatar-report')}<div><strong>${esc(s.name)}</strong><small>Turma: ${esc(className(s.classId))} ${s.enrollment?'• Matrícula: '+esc(s.enrollment):''}</small></div></div>${subjects.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Disciplina</th><th>Notas publicadas</th><th>Média ponderada</th><th>Situação</th></tr></thead><tbody>${subjects.map(sub=>{const gs=published.filter(g=>g.subject===sub),avg=avgGrade(gs);return `<tr><td><strong>${esc(sub)}</strong></td><td style="white-space:normal;min-width:190px">${gs.map(g=>`${esc(g.assessment)}: ${fmt(g.score)}${g.weight!==1?' (peso '+g.weight+')':''}`).join(' · ')}</td><td><strong>${avg===null?'—':fmt(avg)}</strong></td><td>${avg===null?'—':`<span class="pill ${avg>=Number(db.settings.pass)?'green':'amber'}">${avg>=Number(db.settings.pass)?'Média atingida':'Abaixo da média'}</span>`}</td></tr>`}).join('')}</tbody></table></div>`:empty('Nenhuma nota publicada','Publique as notas do aluno na página “Notas e avaliações” para aparecerem aqui.','report')}

function renderSettings(){return heading('PERSONALIZAÇÃO','Configurações','Ajuste o painel e proteja seus dados com cópias de segurança.')+`<div class="settings-wrap"><section class="card settings-card"><h2 class="settings-title">Dados da escola</h2><p class="settings-desc">Essas informações aparecem no seu painel e nos boletins.</p><form id="settingsForm"><div class="form-grid"><div class="form-group"><label for="settingTeacher">Nome do(a) professor(a)</label><input id="settingTeacher" name="teacher" value="${esc(db.settings.teacher)}" maxlength="100" required></div><div class="form-group"><label for="settingSchool">Nome da escola</label><input id="settingSchool" name="school" value="${esc(db.settings.school)}" maxlength="100" required></div><div class="form-group"><label for="settingPass">Média de referência (0 a 10)</label><input id="settingPass" name="pass" type="number" min="0" max="10" step="0.1" value="${db.settings.pass}" required></div><div class="form-group full"><label for="settingSubjects">Disciplinas disponíveis</label><textarea id="settingSubjects" name="subjects" maxlength="2500" rows="3" required>${esc(db.settings.subjects.join(', '))}</textarea><small>Separe cada disciplina por vírgula. Alterar uma disciplina não modifica as notas antigas.</small></div></div><div class="settings-actions"><button class="btn btn-primary" type="submit">${icon('check')} Salvar alterações</button></div></form></section>
<section class="card settings-card"><h2 class="settings-title">Backup e exportação</h2><p class="settings-desc">Seus dados ficam neste navegador, mesmo ao fechar a página. Baixe um arquivo de backup antes de limpar dados ou trocar de aparelho.</p><div class="hint"><span class="notice-dot"></span> ${storageEnabled?'Salvamento local disponível neste navegador.':'Salvamento local indisponível: faça um backup manual.'}<br>Última alteração: ${db.modifiedAt?new Date(db.modifiedAt).toLocaleString('pt-BR'):'—'}</div><div class="settings-actions">${btn('downloadBackup',icon('download')+' Baixar backup (.json)')}${btn('importBackup',icon('upload')+' Restaurar backup','outline')}</div><div class="mini-divider"></div><h2 class="settings-title">Exportar planilhas</h2><p class="settings-desc">Exportações CSV podem ser abertas em Excel ou outros aplicativos de planilhas.</p><div class="settings-actions">${btn('exportStudents','Exportar alunos','outline')}${btn('exportGrades','Exportar notas','outline')}</div></section>
<section class="card settings-card"><h2 class="settings-title">Zona de exclusão</h2><p class="settings-desc">Apaga alunos, turmas, notas e preferências salvos neste navegador. Essa ação não pode ser desfeita sem backup.</p>${btn('resetData',icon('trash')+' Apagar todos os dados','danger')}</section></div>`;}
function toast(message,error=false){const box=document.createElement('div');box.className='toast'+(error?' error':'');box.innerHTML=`${icon(error?'close':'check')}<span>${esc(message)}</span>`;$('#toastWrap').append(box);setTimeout(()=>box.remove(),3700);}
function openModal(title,fields,onSubmit,actionLabel='Salvar'){closeModal();const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button type="button" data-action="closeModal" class="close-btn" aria-label="Fechar">${icon('close')}</button></div><form id="modalForm"><div class="modal-body"><div class="form-grid">${fields}</div></div><div class="modal-foot"><button type="button" data-action="closeModal" class="btn btn-outline">Cancelar</button><button type="submit" class="btn btn-primary">${icon('check')} ${esc(actionLabel)}</button></div></form></div></div>`;const form=$('#modalForm');form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);onSubmit(fd,form);});$('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()});const f=$('input,select,textarea',form);f?.focus();}
function closeModal(){$('#modalRoot').innerHTML='';}
function classForm(id){const c=id?classById(id):null;openModal(c?'Editar turma':'Cadastrar turma',`<div class="form-group full"><label for="className">Nome da turma</label><input name="name" id="className" required minlength="2" maxlength="65" value="${esc(c?.name||'')}" placeholder="Ex.: 1º Ano A"></div><div class="form-group full"><label for="classYear">Ano letivo</label><input name="year" id="classYear" type="number" min="2000" max="2100" required value="${esc(c?.year||new Date().getFullYear())}"></div>`,fd=>{const name=String(fd.get('name')).trim(),year=Number(fd.get('year'));if(!name){toast('Informe o nome da turma.',true);return;}if(c){c.name=name;c.year=year;}else{db.classes.push({id:uid(),name,year});}persist();closeModal();render();toast(c?'Turma atualizada!':'Turma cadastrada!');});}
function studentForm(id){
 const s=id?studentById(id):null;
 if(!db.classes.length){toast('Cadastre uma turma antes de cadastrar alunos.',true);classForm();return;}
 let photo=safePhoto(s?.photo),loading=false;
 const photoFields=`<div class="form-group full"><label>Foto do aluno (opcional)</label><div class="photo-picker"><div class="photo-picker-preview" id="studentPhotoPreview">${avatarHtml({...s,photo,name:s?.name||'Aluno'},'avatar-picker')}</div><div class="photo-picker-actions"><label for="studentPhotoInput" class="btn btn-outline btn-small" style="cursor:pointer">${icon('upload')} Escolher foto</label><input type="file" id="studentPhotoInput" accept="image/jpeg,image/png,image/webp,image/*" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none" aria-label="Escolher foto do aluno"><button type="button" class="btn btn-ghost btn-small ${photo?'':'hidden'}" id="removeStudentPhoto">${icon('trash')} Remover foto</button><small>JPG, PNG ou WebP • até 12 MB. Reduzida automaticamente para economizar espaço.</small><span class="photo-loading" id="photoLoading" aria-live="polite"></span></div></div></div>`;
 const studentFields=`${photoFields}<div class="form-group full"><label for="studentName">Nome completo</label><input id="studentName" name="name" required minlength="2" maxlength="100" value="${esc(s?.name||'')}" placeholder="Nome do aluno"></div><div class="form-group"><label for="studentClass">Turma</label><select name="classId" id="studentClass" required>${optionList(db.classes,s?.classId||db.classes[0]?.id,'Selecione a turma')}</select></div><div class="form-group"><label for="studentEnrollment">Matrícula (opcional)</label><input name="enrollment" id="studentEnrollment" maxlength="40" value="${esc(s?.enrollment||'')}" placeholder="Ex.: 2026-001"></div>`;
 openModal(s?'Editar aluno':'Cadastrar aluno',studentFields,fd=>{
  if(loading){toast('A foto ainda está sendo preparada.',true);return;}
  const name=String(fd.get('name')).trim(),classId=String(fd.get('classId')),enrollment=String(fd.get('enrollment')).trim();
  if(!name||!classById(classId)){toast('Preencha o nome e selecione a turma.',true);return;}
  const previous=s?{...s}:null;
  if(s){Object.assign(s,{name,classId,enrollment,photo});}
  else{db.students.push({id:uid(),name,classId,enrollment,photo,createdAt:now()});}
  if(!persist()){if(s)Object.assign(s,previous);else db.students.pop();toast('Armazenamento cheio. Remova algumas fotos ou faça um backup antes de tentar novamente.',true);return;}
  closeModal();render();toast(s?'Aluno atualizado!':'Aluno cadastrado com sucesso!');
 });
 const preview=$('#studentPhotoPreview'),fileInput=$('#studentPhotoInput'),remove=$('#removeStudentPhoto'),status=$('#photoLoading'),nameInput=$('#studentName');
 function refreshPreview(){preview.innerHTML=avatarHtml({name:nameInput.value||'Aluno',photo},'avatar-picker');remove.classList.toggle('hidden',!photo);}
 nameInput.addEventListener('input',()=>{if(!photo)refreshPreview();});
 remove.addEventListener('click',()=>{photo='';fileInput.value='';refreshPreview();status.textContent='Foto removida. Clique em Salvar para confirmar.';});
 fileInput.addEventListener('change',async()=>{
  const file=fileInput.files?.[0];if(!file)return;loading=true;status.textContent='Preparando a foto...';
  try{const newPhoto=await compressPhoto(file);if(!fileInput.isConnected)return;photo=newPhoto;refreshPreview();status.textContent='Foto pronta para salvar!';}
  catch(err){if(fileInput.isConnected){status.textContent='';toast(err.message||'Não foi possível ler a imagem.',true);}}
  finally{loading=false;fileInput.value='';}
 });
}
function viewStudent(id){const s=studentById(id);if(!s)return;const grades=db.grades.filter(g=>g.studentId===id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),mean=studentAvg(id),published=grades.filter(g=>g.published).length;
 const body=`<div class="profile-head">${avatarHtml(s,'avatar-profile')}<div><h3>${esc(s.name)}</h3><p>${esc(className(s.classId))} • Perfil do estudante</p></div></div><div class="profile-meta"><div><small>MATRÍCULA</small><strong>${esc(s.enrollment||'Não informada')}</strong></div><div><small>MÉDIA GERAL</small><strong>${mean===null?'Sem notas':fmt(mean)}</strong></div><div><small>AVALIAÇÕES</small><strong>${grades.length} registrada(s)</strong></div><div><small>NOTAS PUBLICADAS</small><strong>${published} publicada(s)</strong></div></div><h4 class="profile-section-title">Últimas avaliações</h4><div class="profile-grades">${grades.length?grades.slice(0,5).map(g=>`<div class="student-entry"><div class="entry-main"><strong>${esc(g.subject)} · ${esc(g.assessment)}</strong><small>${g.published?'Publicada':'Rascunho'}</small></div><strong>${fmt(g.score)}</strong></div>`).join(''):'<p class="sub">Nenhuma avaliação registrada.</p>'}</div>`;
 openModal('Perfil do aluno',`<div class="full">${body}</div>`,()=>{});
 const form=$('#modalForm');form.querySelector('.modal-foot').innerHTML=`<button type="button" class="btn btn-outline" data-action="closeModal">Fechar</button><button type="button" class="btn btn-primary" data-action="editStudent" data-id="${esc(s.id)}">${icon('pencil')} Editar perfil e foto</button>`;
}
function gradeForm(id,selectedStudentId=''){const g=id?db.grades.find(x=>x.id===id):null;if(!db.students.length){toast('Cadastre um aluno antes de lançar notas.',true);studentForm();return;}const subs=[...new Set([...db.settings.subjects,...db.grades.map(x=>x.subject)])];openModal(g?'Editar nota':'Lançar nota',`<div class="form-group full"><label for="gradeStudent">Aluno</label><select id="gradeStudent" name="studentId" required>${optionList(db.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')),g?.studentId||selectedStudentId||db.students[0]?.id,'Selecione o aluno',s=>s.id,s=>s.name+' — '+className(s.classId))}</select></div><div class="form-group"><label for="gradeSubject">Disciplina</label><select id="gradeSubject" name="subject" required>${optionList(subs.map(s=>({name:s})),g?.subject||db.settings.subjects[0],'Selecione a disciplina',s=>s.name)}</select></div><div class="form-group"><label for="gradeAssessment">Avaliação</label><input name="assessment" id="gradeAssessment" required maxlength="100" value="${esc(g?.assessment||'')}" placeholder="Ex.: Prova 1, Trabalho"></div><div class="form-group"><label for="gradeScore">Nota (0 a 10)</label><input id="gradeScore" type="number" name="score" min="0" max="10" step="0.01" required value="${g?g.score:''}" placeholder="Ex.: 8,5"></div><div class="form-group"><label for="gradeWeight">Peso da avaliação</label><select id="gradeWeight" name="weight">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(g?.weight||1)===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="form-group full"><label class="switch-label"><input type="checkbox" name="published" value="yes" ${g?.published?'checked':''}> Publicar esta nota imediatamente</label><small>Notas não publicadas ficam em rascunho e não aparecem nos boletins.</small></div>`,fd=>{const studentId=String(fd.get('studentId')),subject=String(fd.get('subject')),assessment=String(fd.get('assessment')).trim(),score=Number(fd.get('score')),weight=Number(fd.get('weight')),published=fd.get('published')==='yes';if(!studentById(studentId)||!subject||!assessment||!Number.isFinite(score)||score<0||score>10||![1,2,3,4,5].includes(weight)){toast('Confira os campos e informe uma nota entre 0 e 10.',true);return;}if(g){Object.assign(g,{studentId,subject,assessment,score,weight,published});}else{db.grades.push({id:uid(),studentId,subject,assessment,score,weight,published,createdAt:now()});}persist();closeModal();render();toast(g?'Nota atualizada!':published?'Nota publicada!':'Nota salva em rascunho!');});}
function doAction(action,id){switch(action){case 'toggleMenu':$('#sidebar').classList.toggle('open');$('#mobileBackdrop').classList.toggle('open');break;case 'closeModal':closeModal();break;case 'newStudent':studentForm();break;case 'editStudent':studentForm(id);break;case 'viewStudent':viewStudent(id);break;case 'gradeForStudent':gradeForm(null,id);break;case 'toggleDiaryStudent':{openDiaryStudentId=openDiaryStudentId===id?'':id;const el=document.querySelector('[data-student-card="'+CSS.escape(id)+'"]');if(el){el.classList.toggle('expanded',!!openDiaryStudentId);const b=el.querySelector('.diary-student-toggle');b.setAttribute('aria-expanded',String(!!openDiaryStudentId));}break;}case 'openDiaryForStudent':{const s=studentById(id);if(!s)return;filters.classDiary=s.classId;openDiaryStudentId=id;setPage('diary');break;}case 'openDiaryForClass':{filters.classDiary=id;openDiaryStudentId='';setPage('diary');break;}case 'newGrade':gradeForm();break;case 'editGrade':gradeForm(id);break;case 'newClass':classForm();break;case 'editClass':classForm(id);break;case 'goGrades':setPage('grades');break;case 'goDiary':setPage('diary');break;case 'reportStudent':filters.reportStudentId=id;setPage('reports');break;case 'printReport':if(window.AndroidBridge&&typeof AndroidBridge.printReport==='function')AndroidBridge.printReport();else window.print();break;case 'deleteStudent':{const s=studentById(id);if(!s)return;if(!confirm(`Excluir ${s.name} e TODAS as notas desse aluno? Esta ação não pode ser desfeita.`))return;db.students=db.students.filter(x=>x.id!==id);db.grades=db.grades.filter(g=>g.studentId!==id);if(filters.reportStudentId===id)filters.reportStudentId='';persist();render();toast('Aluno e notas excluídos.');break;}case 'deleteGrade':{if(!confirm('Excluir esta nota permanentemente?'))return;db.grades=db.grades.filter(g=>g.id!==id);persist();render();toast('Nota excluída.');break;}case 'deleteClass':{const c=classById(id);if(!c)return;if(db.students.some(s=>s.classId===id)){toast('Mova ou exclua os alunos desta turma antes de excluí-la.',true);return;}if(!confirm(`Excluir a turma ${c.name}?`))return;db.classes=db.classes.filter(c=>c.id!==id);persist();render();toast('Turma excluída.');break;}case 'publishGrade':{const g=db.grades.find(x=>x.id===id);if(!g)return;g.published=true;persist();render();toast('Nota publicada no boletim!');break;}case 'unpublishGrade':{const g=db.grades.find(x=>x.id===id);if(!g)return;g.published=false;persist();render();toast('Nota voltou para rascunho.');break;}case 'publishFiltered':{const drafts=matchingGrades().filter(g=>!g.published);if(!drafts.length)return;if(!confirm(`Publicar ${drafts.length} nota(s) em rascunho que estão visíveis nos filtros?`))return;drafts.forEach(g=>g.published=true);persist();render();toast(`${drafts.length} nota(s) publicada(s)!`);break;}case 'downloadBackup':downloadFile('EduClass-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup baixado!');break;case 'importBackup':$('#importFile').click();break;case 'exportStudents':{const rows=[['Nome','Turma','Ano','Matrícula','Média geral'],...db.students.map(s=>[s.name,className(s.classId),classById(s.classId)?.year||'',s.enrollment||'',studentAvg(s.id)===null?'':fmt(studentAvg(s.id))])];downloadCSV('EduClass-alunos.csv',rows);toast('Lista de alunos exportada!');break;}case 'exportGrades':{const rows=[['Aluno','Turma','Disciplina','Avaliação','Nota','Peso','Situação'],...db.grades.map(g=>[studentName(g.studentId),className(studentById(g.studentId)?.classId),g.subject,g.assessment,fmt(g.score),g.weight,g.published?'Publicada':'Rascunho'])];downloadCSV('EduClass-notas.csv',rows);toast('Notas exportadas!');break;}case 'resetData':{if(!confirm('ATENÇÃO: deseja apagar todos os alunos, notas, turmas e configurações? Faça um backup antes.'))return;if(!confirm('Confirma a exclusão definitiva dos dados deste navegador?'))return;db=defaultData();filters={studentsSearch:'',studentsClass:'',classDiary:'',gradesSearch:'',gradesClass:'',gradesSubject:'',gradesStatus:'',reportStudentId:''};openDiaryStudentId='';persist();setPage('dashboard');toast('Dados reiniciados.');break;}}}
function downloadFile(name,content,mime){if(window.AndroidBridge&&typeof AndroidBridge.saveFile==='function'){AndroidBridge.saveFile(name,content,mime);return;}const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadCSV(name,rows){const str=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile(name,'\ufeff'+str,'text/csv;charset=utf-8');}
function handleSearchInput(el){const key=el.dataset.filter;if(!key)return;filters[key]=el.value;const pos=el.selectionStart;const pageScroll=window.scrollY;render();const newEl=$(`[data-filter="${key}"]`);if(newEl){newEl.focus({preventScroll:true});try{newEl.setSelectionRange(pos,pos);}catch(e){}}window.scrollTo(0,pageScroll);}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return;}const act=e.target.closest('[data-action]');if(act)doAction(act.dataset.action,act.dataset.id);});
document.addEventListener('input',e=>{if(e.target.matches('[data-filter][type="search"]'))handleSearchInput(e.target);});
document.addEventListener('change',e=>{if(e.target.matches('select[data-filter]')){filters[e.target.dataset.filter]=e.target.value;render();}});
$('#mobileBackdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobileBackdrop').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#sidebar').classList.remove('open');$('#mobileBackdrop').classList.remove('open');}});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();const fd=new FormData(e.target);const teacher=String(fd.get('teacher')).trim(),school=String(fd.get('school')).trim(),pass=Number(fd.get('pass'));const subjects=[...new Set(String(fd.get('subjects')).split(',').map(x=>x.trim()).filter(Boolean))];if(!teacher||!school||!Number.isFinite(pass)||pass<0||pass>10||!subjects.length){toast('Preencha corretamente todos os campos.',true);return;}db.settings={teacher,school,pass,subjects};persist();render();toast('Configurações salvas!');});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('Arquivo muito grande (máximo 15 MB).');const data=JSON.parse(await f.text());if(!validData(data)||!data.settings||!Array.isArray(data.settings.subjects))throw Error('Arquivo de backup inválido.');if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;const sane={version:1,settings:{teacher:String(data.settings.teacher||'Professor(a)').slice(0,100),school:String(data.settings.school||'Minha escola').slice(0,100),pass:Number(data.settings.pass)>=0&&Number(data.settings.pass)<=10?Number(data.settings.pass):6,subjects:data.settings.subjects.filter(s=>typeof s==='string').map(s=>s.slice(0,100)).slice(0,100)},classes:data.classes.filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string').map(c=>({id:c.id,name:c.name.slice(0,100),year:Number(c.year)||new Date().getFullYear()})).slice(0,2000),students:data.students.filter(s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&typeof s.classId==='string').map(s=>({id:s.id,name:s.name.slice(0,100),classId:s.classId,enrollment:String(s.enrollment||'').slice(0,40),photo:safePhoto(s.photo),createdAt:s.createdAt||now()})).slice(0,20000),grades:data.grades.filter(g=>g&&typeof g.id==='string'&&typeof g.studentId==='string'&&typeof g.subject==='string'&&typeof g.assessment==='string'&&Number(g.score)>=0&&Number(g.score)<=10).map(g=>({id:g.id,studentId:g.studentId,subject:g.subject.slice(0,100),assessment:g.assessment.slice(0,100),score:Number(g.score),weight:[1,2,3,4,5].includes(Number(g.weight))?Number(g.weight):1,published:!!g.published,createdAt:g.createdAt||now()})).slice(0,100000),modifiedAt:now()};if(!sane.settings.subjects.length)sane.settings.subjects=defaultData().settings.subjects;db=sane;filters={studentsSearch:'',studentsClass:'',classDiary:'',gradesSearch:'',gradesClass:'',gradesSubject:'',gradesStatus:'',reportStudentId:''};openDiaryStudentId='';persist();render();toast('Backup restaurado com sucesso!');}catch(err){toast(err.message||'Não foi possível ler o backup.',true);}finally{e.target.value='';}});
if(storageEnabled){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageEnabled=false;}}
render();
window.educlassHandleBack=()=>{if($('#modalRoot').children.length){closeModal();return true;}if($('#sidebar').classList.contains('open')){$('#sidebar').classList.remove('open');$('#mobileBackdrop').classList.remove('open');return true;}if(page!=='dashboard'){setPage('dashboard');return true;}return false;};
})();
</script>
