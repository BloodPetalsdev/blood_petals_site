name: Silent Garden Motion Studio — Android 1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/motion-studio-android.yml'
permissions:
  contents: read
jobs:
  apk:
    name: Compilar APK Android 1.1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Importar renderer V1.1 sem assets privados
        run: |
          mkdir -p renderer
          cp ../desktop/renderer/index.html renderer/index.html
          cp ../desktop/renderer/app.js renderer/app.js
          cp ../desktop/renderer/theme.js renderer/theme.js
          cp ../desktop/renderer/startup.js renderer/startup.js
          cp ../desktop/assets/icon.png icon.png
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Compilar interface e motor 3D para Android offline
        run: |
          npm run build
          npm run verify:web
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK Android de testes
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Publicar APK de base
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SilentGardenMotionStudio-Android-1.1-BASE.apk
      - name: Upload APK de base
        uses: actions/upload-artifact@v4
        with:
          name: SilentGardenMotionStudio-Android-1.1-BASE
          path: android-app/dist/SilentGardenMotionStudio-Android-1.1-BASE.apk
          if-no-files-found: error
          retention-days: 30
