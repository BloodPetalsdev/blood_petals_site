name: Motion Studio — Portable Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'studio/index.html'
      - '.github/workflows/motion-studio-portable.yml'

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validar codigo JavaScript do editor
        run: npm run check
      - name: Validate editor JavaScript
        run: npm run check
      - name: Smoke test MainMenu and 3D Editor
        run: npm run smoke:win
      - name: Compile Windows portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows portable executable
        uses: actions/upload-artifact@v4
        with:
          name: SilentGardenMotionStudio-Windows-Alpha-0.9.9
          path: desktop/dist/SilentGardenMotionStudio-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
